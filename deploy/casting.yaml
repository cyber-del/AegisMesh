# AegisMesh — SigNoz self-hosted deployment (SigNoz Foundry)
#
# This is the ONLY file we hand-edit. `foundryctl` reads it and generates the full
# Docker Compose stack into ./pours (which is gitignored) plus a resolved
# casting.yaml.lock (which IS committed, so the exact stack is reproducible).
#
# Deploy from the repo root:
#     foundryctl gauge -f deploy/casting.yaml      # check prerequisites (docker)
#     foundryctl forge -f deploy/casting.yaml      # generate ./pours + lock
#     cd pours/deployment && docker compose up -d  # start the stack
#   (or the one-shot equivalent:  foundryctl cast -f deploy/casting.yaml )
#
# Brings up: signoz UI (:8080), otel-collector "ingester" (OTLP :4317 gRPC / :4318 HTTP),
# clickhouse + clickhouse-keeper (telemetry store), postgres (metastore), and the
# SigNoz MCP server (:8000).
#
# MCP note for the team lead: the MCP container starts with SIGNOZ_URL wired to the
# internal SigNoz service but WITHOUT a SIGNOZ_API_KEY. Generate an API key in the SigNoz
# UI (Settings -> Service Accounts / API Keys) once it is up, then supply it to the MCP
# server. Do NOT commit the key — inject it via environment. See HANDOVER.md section 5.

apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
  mcp:
    spec:
      enabled: true
